<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>logoipsum</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="resources/images/logo.svg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <header class="UpPageHeader">
        <div class="UpPageHeader__container">
            <nav class="UpPageHeader__nav">
                <img src="resources/images/Logo Color.svg" alt="">
                <ul class="UpPageHeader__list">
                    <li class="UpPageHeader__list-item">
                        <a class="UpPageHeader__list-link active" href="/">Home</a>
                    </li>
                    <li class="UpPageHeader__list-item">
                        <a class="UpPageHeader__list-link" href="/">Features</a>
                    </li>
                    <li class="UpPageHeader__list-item">
                        <a class="UpPageHeader__list-link" href="/">Pricing</a>
                    </li>
                    <li class="UpPageHeader__list-item">
                        <a class="UpPageHeader__list-link" href="/">Blog</a>
                    </li>
                </ul>
                <a class="UpPageHeader__button" href="/">
                    Get Started
                </a>
            </nav>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="hero__container">
                <div class="hero__content">
                    <div class="hero__text">
                        <h1 class="hero__title">
                            Grow your subscription business
                        </h1>
                        <h1 class="hero__desc">
                            Outcome-centered products that reduce churn, optimize pricing, and grow your subscription business end-to-end.
                        </h1>
                    </div>
                    <div class="hero__buttons">
                        <a class="hero__button" href="/">
                            Get Started
                        </a>
                        <a class="hero__button-scroll" href="/">
                            Try
                        </a>
                    </div>
                </div>
                <img class="hero__image" src="resources/images/Hero 3D.png" alt="">
            </div>
        </section>
    </main>
</body>
</html>
